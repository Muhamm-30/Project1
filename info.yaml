# Tiny Tapeout project information
project:
  title:        "TinyTensor - INT4 Matrix Accelerator"      # Project title
  author:       ""      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "2x2 signed INT4 matrix multiplication accelerator""      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_muhamm30_tinytensor"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "tensortop.v"
    - "matrix_core.v"
    - "mac_unit.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Operand data bit 0"
  ui[1]: "Operand data bit 1"
  ui[2]: "Operand data bit 2"
  ui[3]: "Operand data bit 3"
  ui[4]: "Operand data bit 4"
  ui[5]: "Operand data bit 5"
  ui[6]: "Operand data bit 6"
  ui[7]: "Operand data bit 7"


  # Outputs
  uo[0]: "Result/status bit 0"
  uo[1]: "Result/status bit 1"
  uo[2]: "Result/status bit 2"
  uo[3]: "Result/status bit 3"
  uo[4]: "Result/status bit 4"
  uo[5]: "Result/status bit 5"
  uo[6]: "Result/status bit 6"
  uo[7]: "Result/status bit 7"

  # Bidirectional pins
  uio[0]: "Command bit 0"
  uio[1]: "Command bit 1"
  uio[2]: "Index bit 0"
  uio[3]: "Index bit 1"
  uio[4]: "Index bit 2"
  uio[5]: "Status select"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
